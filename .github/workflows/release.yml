name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          IFS=. read -r major minor patch <<< "${version%%-*}"
          # 0.4.2 -> 402: must grow with every release so Android accepts the update.
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mira.jks"
            password="$KEYSTORE_PASSWORD"
          else
            # No secret set: sign with a throwaway key. Every build then has a different
            # fingerprint, so the Spotify dashboard entry must be updated and users must uninstall first.
            password="throwaway-$RANDOM$RANDOM"
            keytool -genkeypair -keystore "$RUNNER_TEMP/mira.jks" -storepass "$password" -keypass "$password" \
              -alias mira -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mira"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a throwaway key."
          fi
          echo "::add-mask::$password"
          {
            echo "MIRA_KEYSTORE=$RUNNER_TEMP/mira.jks"
            echo "MIRA_KEYSTORE_PASSWORD=$password"
            echo "MIRA_KEY_ALIAS=mira"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}

      - name: Name the APK and print its fingerprint
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$apk" "dist/mira-android-${{ steps.version.outputs.name }}.apk"
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          # This SHA-1 is what the Spotify dashboard needs under "Android Packages".
          "$tools/apksigner" verify --print-certs "dist/mira-android-${{ steps.version.outputs.name }}.apk" | grep -i "SHA-1"

      - uses: actions/upload-artifact@v4
        with:
          name: mira-android
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.name }}"
          notes="Install \`mira-android-$version.apk\` on your phone. You need the Spotify app, Spotify Premium and your own Spotify Developer app; the steps are in the README."
          gh release create "$GITHUB_REF_NAME" "dist/mira-android-$version.apk" --repo "$GITHUB_REPOSITORY" --title "Mira for Android $version" --notes "$notes"
